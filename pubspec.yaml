name: brrk
description: "Local-first Android reading support for paper books and PDFs with BYOK Mistral OCR."
publish_to: 'none'

version: 0.1.0-beta.2+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rust_lib_brrk:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  image: ^4.3.0
  uuid: ^4.5.1
  camera: ^0.11.0+2
  file_picker: ^8.1.7
  flutter_markdown: ^0.7.7
  shared_preferences: ^2.3.4
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/brrk_icon.png"
  adaptive_icon_background: "assets/icon/brrk_background_icon.png"
  adaptive_icon_foreground: "assets/icon/brrk_foreground_icon.png"
  min_sdk_android: 26

